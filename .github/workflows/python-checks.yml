name: Python Checks

on:
  pull_request:
    paths: ["ops/**", "dataflow/**"]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install flake8
      - name: Lint
        run: flake8 ops dataflow --max-line-length=100 --extend-ignore=E203,W503